<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- header.jpeg, cropped square inside an SVG wrapper. The source is 1600x900; handed to a
         tab directly it letterboxes into a thin strip. ?v=2 busts the cache — browsers hold on
         to a favicon far longer than they hold the page, so without it the old icon survives a
         deploy. The PNG stays as the fallback for anything that cannot render an SVG icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-header.svg?v=2" />
    <!-- 32x32, which is all a tab ever renders. This used to point at logo_transparent_2.png —
         the 1024x1024, 990 KB master — so every first visit downloaded a megabyte to draw a
         favicon. That file still exists and is still needed: the OG-image fallback in
         api/reel.js and api/product/[slug].js points at it, and social scrapers want a large
         image. It just has no business being a favicon. -->
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/header.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banarasi Kala</title>
    <meta name="description" content="Shop authentic Banarasi sarees, handwoven silk, and premium accessories from Banarasi Kala." />
    <meta property="og:title" content="Banarasi Kala" />
    <meta property="og:description" content="Shop authentic Banarasi sarees, handwoven silk, and premium accessories from Banarasi Kala." />
    <meta property="og:image" content="/header.jpeg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:type" content="website" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Banarasi Kala" />
    <meta property="twitter:description" content="Shop authentic Banarasi sarees, handwoven silk, and premium accessories from Banarasi Kala." />
    <meta property="twitter:image" content="/header.jpeg" />

    <!-- Scripts -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
